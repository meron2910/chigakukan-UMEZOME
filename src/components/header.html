<!-- ================================================================
     UMEZOME - 共通ヘッダーコンポーネント
     ファイル: src/components/header.html
     
     【説明】
     全ページで共通して使われるヘッダー（ナビゲーション）です。
     JavaScript (Fetch API) によって、各ページの
     <div id="site-header-placeholder"></div>
     の中に自動的に読み込まれます。

     【どこからどこまでがヘッダーか】

================================================================ -->
<header class="site-header" id="site-header">

    </a>

    <!-- ハンバーガーボタン (スマートフォン・タブレット用) -->
    <button class="nav-hamburger" id="nav-hamburger"
            aria-label="メニューを開閉する" aria-expanded="false"
            aria-controls="nav-menu">
      <span></span>
      <span></span>
      <span></span>

    <!-- ナビゲーションメニュー (リンク一覧) -->
    <nav class="nav-menu" id="nav-menu" role="navigation" aria-label="メインナビゲーション">

      <a href="src/pages/documents.html"    class="nav-menu__link" data-page="documents">資料</a>
      <a href="index.html#contact"          class="nav-cta nav-menu__link" data-page="contact">お問い合わせ</a>
